<!doctype html>
<!--
  Saha46 — takım daveti köprüsü
  Yayınlanacak adres: https://saha46.app/davet/<kod>   (örn. /davet/MS-4A43)

  NE İŞE YARAR
  Uygulamadaki "Takım arkadaşını davet et" akışı bu adresi paylaşır.
  Bağlantıya tıklayan kişi:
    - uygulama kuruluysa doğrudan katılım ekranına düşer,
    - kurulu değilse kodu ekranda görür ve mağazaya yönlendirilir.

  Mobil tarayıcılar bir web adresinden "saha46://" şemasına OTOMATİK
  yönlenmeyi engellediği için araya bu sayfa girer; giris-tamam.html ile
  aynı mantık.

  KURULUM
  - Kod adresten okunur. Yol biçimi (/davet/MS-4A43) için sunucu
    yönlendirmesi gerekir: Vercel'de vercel.json rewrites, Cloudflare'de
    _redirects bunu yapar.
  - Vercel'de rewrite hedefi ".html" ile BİTMEMELİ. cleanUrls açık olduğu
    için /davet/index.html adresi 308 ile yönlendiriliyor ve rewrite
    zinciri kırılıp 404 veriyor; hedef /davet/ olmalı.
  - Sorgu biçimi (/davet/?kod=MS-4A43) yönlendirme olmadan da çalışır.

  DEĞİŞTİRİRKEN DİKKAT
  - Kod sunucuda DOĞRULANMAZ; sayfa yalnızca yönlendirme yapar. Geçerlilik
    denetimi uygulama tarafında.
  - Koddaki karakterler süzülür (A-Z, 0-9, tire); bu, adres üzerinden
    betik enjeksiyonunu engeller, kaldırılmamalı.
-->
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Saha46 · Takım daveti</title>
  <style>
    :root {
      --brand: #0097B2;
      --ink: #00738A;
      --bg: #F3F7F9;
      --surface: #FFFFFF;
      --surface-alt: #ECF3F5;
      --line: #E0E8EB;
      --text: #0A2A33;
      --muted: #546873;
      --faint: #879AA3;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
    }
    .card {
      width: 100%;
      max-width: 420px;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: 0 4px 14px rgba(10, 42, 51, 0.06);
    }
    .head {
      background: var(--brand);
      color: #fff;
      text-align: center;
      padding: 26px 24px;
    }
    .head .name { font-size: 24px; font-weight: 800; letter-spacing: -0.5px; }
    .head .slogan { font-size: 13px; opacity: 0.85; margin-top: 6px; }
    .body { padding: 28px 24px; }
    h1 { margin: 0 0 10px; font-size: 20px; letter-spacing: -0.4px; }
    p { margin: 0 0 18px; font-size: 15px; line-height: 23px; color: var(--muted); }

    /* Katılım kodu — sayfanın asıl içeriği, en büyük öğe. */
    .code-box {
      background: var(--surface-alt);
      border-radius: 14px;
      text-align: center;
      padding: 20px 16px;
      margin: 0 0 18px;
    }
    .code-label {
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.6px;
      text-transform: uppercase;
      color: var(--faint);
      margin-bottom: 8px;
    }
    .code {
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 2px;
      line-height: 1.15;
      color: var(--ink);
      word-break: break-all;
    }

    .btn {
      display: block;
      text-align: center;
      text-decoration: none;
      padding: 15px 20px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: 700;
      background: var(--brand);
      color: #fff;
      border: 0;
      width: 100%;
      font-family: inherit;
      cursor: pointer;
    }
    .btn.secondary {
      background: #fff;
      color: var(--text);
      border: 1px solid #C9DAE0;
      margin-top: 10px;
    }
    .stores { display: none; margin-top: 10px; }
    .state { font-size: 13px; font-weight: 600; color: #0B7A43; min-height: 20px; margin: 8px 0 0; text-align: center; }
    .note { font-size: 12px; line-height: 18px; color: var(--faint); margin: 18px 0 0; }
    .error { display: none; font-size: 14px; color: #CE2532; margin-bottom: 14px; }
  </style>
</head>
<body>
  <main class="card">
    <div class="head">
      <div class="name">SAHA46</div>
      <div class="slogan">Rakipsiz kalma</div>
    </div>

    <div class="body">
      <h1 id="title">Takıma davet edildin</h1>
      <p id="text">Aşağıdaki düğmeye dokunarak uygulamada takıma katılabilirsin.</p>
      <p class="error" id="error"></p>

      <div class="code-box" id="codeBox">
        <div class="code-label">Katılım kodu</div>
        <div class="code" id="code">—</div>
      </div>

      <a class="btn" id="open" href="#">Uygulamada aç</a>
      <button class="btn secondary" id="copy" type="button">Kodu kopyala</button>
      <p class="state" id="state" role="status" aria-live="polite"></p>

      <div class="stores" id="stores">
        <a class="btn secondary" id="ios" href="#">App Store’dan indir</a>
        <a class="btn secondary" id="android" href="#">Google Play’den indir</a>
      </div>

      <p class="note">
        Uygulama açılmazsa kurulu olmayabilir. Uygulamayı indirip bu kodu
        <strong>Takımım → Takıma katıl</strong> ekranına gir.
      </p>
    </div>
  </main>

  <script>
    (function () {
      // Kod iki biçimde gelebilir: /davet/MS-4A43 ya da /davet/?kod=MS-4A43
      var yol = decodeURIComponent(location.pathname).split('/').filter(Boolean);
      var ham = (yol[0] === 'davet' && yol[1])
        ? yol[1]
        : (new URLSearchParams(location.search).get('kod') || '');

      // Yalnızca büyük harf, rakam ve tire kalsın: adresten gelen değer
      // doğrudan sayfaya yazıldığı için süzülmesi şart.
      var kod = ham.toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 24);

      var codeEl = document.getElementById('code');
      var link = document.getElementById('open');
      var copy = document.getElementById('copy');
      var state = document.getElementById('state');

      if (!kod) {
        document.getElementById('title').textContent = 'Davet kodu bulunamadı';
        document.getElementById('text').textContent =
          'Bağlantı eksik ya da bozuk görünüyor. Seni davet eden takım arkadaşından yeni bir bağlantı iste.';
        var box = document.getElementById('error');
        box.textContent = 'Adreste geçerli bir katılım kodu yok.';
        box.style.display = 'block';
        document.getElementById('codeBox').style.display = 'none';
        link.style.display = 'none';
        copy.style.display = 'none';
        document.getElementById('stores').style.display = 'block';
        magazalariDoldur();
        return;
      }

      codeEl.textContent = kod;
      var target = 'saha46://davet/' + encodeURIComponent(kod);
      link.href = target;

      // Otomatik denemeyi bir kez yap; tarayıcı engellerse düğme zaten duruyor.
      var opened = false;
      link.addEventListener('click', function () { opened = true; });
      setTimeout(function () { location.href = target; }, 300);

      // Uygulama açılmadıysa mağaza seçeneklerini göster.
      setTimeout(function () {
        if (opened || document.hidden) return;
        document.getElementById('stores').style.display = 'block';
      }, 2500);

      copy.addEventListener('click', function () {
        function bitir(ok) {
          state.textContent = ok ? 'Kod kopyalandı.' : 'Kopyalanamadı, kodu elle yaz.';
          state.style.color = ok ? '#0B7A43' : '#CE2532';
        }
        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(kod).then(function () { bitir(true); }, function () { bitir(false); });
        } else {
          bitir(false);
        }
      });

      magazalariDoldur();

      // App Store kimliği: App Store Connect → App Information → Apple ID.
      // Google Play adresi uygulama yayınlanınca doğrulanmalı.
      function magazalariDoldur() {
        document.getElementById('ios').href = 'https://apps.apple.com/tr/app/saha46/id6806569848';
        document.getElementById('android').href =
          'https://play.google.com/store/apps/details?id=com.saha46.app';
      }
    })();
  </script>
</body>
</html>
